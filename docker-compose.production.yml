volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: ghcr.io/jvacek/flamerelay-django:latest
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    volumes:
      - /srv/flamerelay/media:/app/flamerelay/media
    ports:
      - '127.0.0.1:8000:5000'
    # Host /etc/resolv.conf is owned by Tailscale and points only at MagicDNS,
    # which doesn't resolve public names unless an admin sets global nameservers.
    # Pin DNS here so Turnstile siteverify and other outbound calls work.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ghcr.io/jvacek/flamerelay-postgres:latest
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  redis:
    image: docker.io/redis:8.6

    volumes:
      - production_redis_data:/data

  celeryworker:
    <<: *django
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    ports:
      - '127.0.0.1:5556:5555'
    command: /start-flower
