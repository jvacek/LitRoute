      - can_check_in
      - checkin_count
      - date_created
      - distance_traveled_km
      - follower_count
      - game
      - identifier
      - is_following
      - is_gps_enforced
      - team
    User:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        name:
          type: string
          title: Name of User
          maxLength: 255
        language:
          type: string
          maxLength: 10
        receive_ty_emails:
          type: boolean
        admin_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - admin_url
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
