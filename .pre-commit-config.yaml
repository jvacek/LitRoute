exclude: '/migrations/|devcontainer.json'
default_stages: [pre-commit]
minimum_pre_commit_version: '3.2.0'

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        exclude: '^docker-compose\.e2e\.yml$'
      - id: detect-private-key

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: npm run lint
        pass_filenames: false
        types_or: [ts, tsx]
      - id: tsc
        name: typescript
        language: system
        entry: npm run typecheck
        pass_filenames: false
        types_or: [ts, tsx]
      - id: lint-translations
        name: lint translation JSON (sort + drop stale keys)
        language: script
        entry: scripts/lint-translations.py
        files: ^flamerelay/static/locales/[^/]+/translation\.json$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ['--tab-width', '2', '--single-quote']
        # Templates: jinja-style braces aren't valid JS — prettier chokes.
        # openapi.yaml + schema.d.ts: auto-generated by `just specs` from
        # drf-spectacular + openapi-typescript; the CI drift gates re-run
        # those tools and `diff` the output, so any reformatting in the
        # middle would break the comparison.
        exclude: '(flamerelay|backend)/templates/|^openapi\.yaml$|^flamerelay/static/js/api/schema\.d\.ts$'

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.30.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.21.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        exclude: 'brand/'
      - id: djlint-django
        exclude: 'brand/'

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.14
    hooks:
      - id: uv-lock
# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: [eslint, tsc]
  submodules: false
