# Security updates only — version update PRs are disabled via open-pull-requests-limit: 0.
# A GitHub Actions workflow (.github/workflows/dependabot-severity-filter.yml) further
# narrows security PRs to critical severity (CVSS >= 9.0).

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/django/'
      - 'compose/production/django/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/node/'
      - 'compose/production/postgres/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0
