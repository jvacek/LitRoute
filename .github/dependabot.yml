# Security updates only — version update PRs are disabled via open-pull-requests-limit: 0.
# .github/workflows/dependabot-severity-filter.yml further narrows security PRs:
# PRs that only fix advisories rated below critical (CVSS < 9.0) are closed
# automatically, based on the public OSV advisory database.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/django/'
      - 'compose/production/django/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/node/'
      - 'compose/production/postgres/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 0
