# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Every weekday
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'

  # Enable version updates for Docker
  - package-ecosystem: 'docker'
    # Look for a `Dockerfile` in the `compose/local/django` directory
    directories:
      - 'compose/local/django/'
      - 'compose/production/django/'
    # Every weekday
    schedule:
      interval: 'daily'
    # Ignore minor version updates (3.10 -> 3.11) but update patch versions
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker-python:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    # Look for a `Dockerfile` in the listed directories
    directories:
      - 'compose/local/node/'
      - 'compose/production/postgres/'
    # Every weekday
    schedule:
      interval: 'daily'
    # Node uses even/odd LTS model — odd versions (25, 27…) are non-LTS dev releases.
    # Block major bumps so we only track patch updates within the current LTS line.
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'

  # Enable version updates for Docker Compose files
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    # Every weekday
    schedule:
      interval: 'daily'

  # Enable version updates for Python/uv
  - package-ecosystem: 'uv'
    # Look for a `pyproject.toml` in the `root` directory
    directory: '/'
    # Every weekday
    schedule:
      interval: 'daily'
    # Only track [project.dependencies], skip [dependency-groups.dev] tooling.
    allow:
      - dependency-type: 'production'
    groups:
      python:
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for npm/package.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # Only track runtime `dependencies`, skip `devDependencies`.
    allow:
      - dependency-type: 'production'
    groups:
      npm:
        patterns:
          - '*'
