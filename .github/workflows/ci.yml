name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']

  push:
    branches: ['main']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle (for size-limit check)
        run: npm run build

      - name: Check bundle size budgets
        run: npm run size

      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create local env files for bake
        run: |
          cp .envs/.local/.django.example .envs/.local/.django
          cp .envs/.local/.postgres.example .envs/.local/.postgres
          echo "POSTGRES_USER=postgres" >> .envs/.local/.postgres
          echo "POSTGRES_PASSWORD=postgres" >> .envs/.local/.postgres

      - name: Build and cache local backend
        uses: docker/bake-action@v7
        with:
          push: false
          load: true
          files: docker-compose.local.yml
          targets: |
            django
            postgres
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max
            postgres.cache-from=type=gha,scope=postgres-cached-tests
            postgres.cache-to=type=gha,scope=postgres-cached-tests,mode=max

      - name: Check Migrations, Migrate, and Run Tests
        run: |
          docker compose -f docker-compose.local.yml run --rm django \
            sh -c "python manage.py makemigrations --check && python manage.py migrate && pytest"

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down

  build-and-push:
    needs: [pytest, linter]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file stubs for bake
        run: mkdir -p .envs/.production && touch .envs/.production/.django .envs/.production/.postgres

      - name: Build and push Django image
        uses: docker/bake-action@v7
        with:
          push: true
          files: docker-compose.production.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=prod-django
            django.cache-to=type=gha,scope=prod-django,mode=max
            django.args.GIT_HASH=${{ github.sha }}
            django.args.SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            django.args.SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            django.args.SENTRY_PROJECT_FRONTEND=${{ secrets.SENTRY_PROJECT_FRONTEND }}

      - name: Build and push Postgres image
        uses: docker/bake-action@v7
        with:
          push: true
          files: docker-compose.production.yml
          targets: postgres
          set: |
            postgres.cache-from=type=gha,scope=prod-postgres
            postgres.cache-to=type=gha,scope=prod-postgres,mode=max

  deploy:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Start Deployment via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: Git/FlameRelay/deploy.sh

      - name: Delete old untagged Django image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: flamerelay-django
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true

      - name: Delete old untagged Postgres image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: flamerelay-postgres
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
